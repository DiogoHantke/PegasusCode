[platformio]
default_envs = atmega328p

[env:atmega328p]
platform = atmelavr@5.1.0
board = uno
board_build.f_cpu = 16000000L
upload_speed = 115200
monitor_speed = 115200
build_src_filter = +<main.c> +<calibration/*.c> +<communication/*.c>
build_flags =
    -DPEGASUS_SUPERVISOR
    -DBT_BAUD=9600UL
    -Iinclude
    -std=gnu11
    -Wall
    -Wextra
    -Ilib/adc
    -Ilib/pwm
    -Ilib/timer

[env:test_motors]
extends = env:atmega328p
build_src_filter = +<diagnostics/motors.c>
