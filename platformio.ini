[platformio]
default_envs = nano_running

[env:atmega328p]
platform = atmelavr@5.1.0
board = uno
board_build.f_cpu = 16000000L
upload_speed = 115200
monitor_speed = 9600
build_src_filter = +<main.c> +<line_follower.c> +<calibration/*.c> +<communication/*.c>
build_flags =
    -DPEGASUS_SUPERVISOR
    -DBT_BAUD=9600UL
    -Iinclude
    -std=gnu11
    -Wall
    -Wextra
    -Ilib/adc
    -Ilib/pwm
    -Ilib/timer

[env:test_motors]
extends = env:atmega328p
build_src_filter = +<diagnostics/motors.c>

[env:test_led_emergency]
extends = env:atmega328p
build_src_filter = +<diagnostics/led_emergency.c>

[env:nano_running]
extends = env:atmega328p
board = nanoatmega328
upload_speed = 57600
build_src_filter = +<main.c> +<line_follower.c> +<calibration/*.c> +<communication/system_init.c>
build_flags =
    -Iinclude
    -std=gnu11
    -Wall
    -Wextra
    -Ilib/adc
    -Ilib/pwm
    -Ilib/timer
